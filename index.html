<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作業催繳器</title>
    <style>
        :root {
            --primary-color: #ff6b6b;
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #fa5252;
        }
        .nag-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #fff3bf;
            border-left: 5px solid #f59f00;
            border-radius: 4px;
            font-size: 0.95rem;
            color: #e67700;
            display: none;
        }
        .task-list {
            margin-top: 25px;
        }
        .task-card {
            background: #fff;
            border: 1px solid #eee;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .task-info h3 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
        }
        .task-info p {
            margin: 0;
            color: #777;
            font-size: 0.85rem;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-left: 5px;
            color: white;
            background-color: #e03131;
        }
        .task-actions {
            display: flex;
            gap: 8px;
        }
        .btn-nag {
            background-color: #fab005;
            width: auto;
            padding: 6px 12px;
            font-size: 0.85rem;
        }
        .btn-done {
            background-color: #40c057;
            width: auto;
            padding: 6px 12px;
            font-size: 0.85rem;
        }
        .empty-text {
            color: #999;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚨 作業催繳器</h1>
    <div class="subtitle">專為拖延症設計的智慧督促系統</div>

    <!-- 新增作業表單 -->
    <div class="form-group">
        <label for="taskName">作業名稱</label>
        <input type="text" id="taskName" placeholder="例如：資料結構小考複習">
    </div>
    <div class="form-group">
        <label for="taskDate">截止日期</label>
        <input type="date" id="taskDate">
    </div>
    <!-- 加上 type="button" 防止觸發預設表單提交或重新整理 -->
    <button type="button" onclick="addTask()">新增作業並開始倒數</button>

    <!-- 隨機碎碎念提示框 -->
    <div id="nagBox" class="nag-box"></div>

    <!-- 任務列表 -->
    <div class="task-list">
        <h3>📋 目前待繳作業清單</h3>
        <div id="taskListContainer">
            <p id="emptyNotice" class="empty-text">目前沒有作業，快新增一個吧！</p>
        </div>
    </div>
</div>

<script>
    const nagMessages = [
        "「明天再說」的明天已經到了，你還在滑手機？",
        "程式碼不會自己跑出來，快去寫作業！",
        "助教正在瞪著你，趕快把作業交出來！",
        "拖延是心靈的舒適圈，但會讓你的成績很痛苦。",
        "別看了，現在立刻打開編輯器！"
    ];

    function addTask() {
        const nameInput = document.getElementById('taskName');
        const dateInput = document.getElementById('taskDate');
        const name = nameInput.value.trim();
        const date = dateInput.value;
        
        if (!name || !date) {
            alert('請完整填寫作業名稱與截止日期！');
            return;
        }

        // 移除預設的「目前沒有作業」提示文字
        const emptyNotice = document.getElementById('emptyNotice');
        if (emptyNotice) {
            emptyNotice.remove();
        }

        // 計算倒數天數
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const targetDate = new Date(date);
        const diffTime = targetDate - today;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        
        let daysText = "";
        if (diffDays < 0) {
            daysText = `<span class="badge" style="background-color: #868e96;">已逾期</span>`;
        } else if (diffDays === 0) {
            daysText = `<span class="badge">今天截止！</span>`;
        } else {
            daysText = `<span class="badge" style="background-color: #15aabf;">還剩 ${diffDays} 天</span>`;
        }

        const container = document.getElementById('taskListContainer');
        const card = document.createElement('div');
        card.className = 'task-card';
        card.innerHTML = `
            class="task-info">
                <h3>${name} ${daysText}</h3>
                <p>截止日期：${date}</p>
            </div>
            <div class="task-actions">
                <button type="button" class="btn-nag" onclick="showNag()">催繳碎碎念</button>
                <button type="button" class="btn-done" onclick="removeTask(this)">完成繳交</button>
            </div>
        `;
        // 修正上一行 HTML 標籤開頭的小細節
        card.innerHTML = `
            <div class="task-info">
                <h3>${name} ${daysText}</h3>
                <p>截止日期：${date}</p>
            </div>
            <div class="task-actions">
                <button type="button" class="btn-nag" onclick="showNag()">催繳碎碎念</button>
                <button type="button" class="btn-done" onclick="removeTask(this)">完成繳交</button>
            </div>
        `;
        
        // 使用 appendChild 確保新項目一定會加在後面，絕對不會覆蓋舊項目
        container.appendChild(card);

        // 清空輸入欄位
        nameInput.value = '';
        dateInput.value = '';
    }

    function showNag() {
        const nagBox = document.getElementById('nagBox');
        const randomMsg = nagMessages[Math.floor(Math.random() * nagMessages.length)];
        nagBox.style.display = 'block';
        nagBox.innerText = `💡 催繳提示：${randomMsg}`;
    }

    function removeTask(button) {
        const card = button.closest('.task-card');
        card.remove();
        
        const container = document.getElementById('taskListContainer');
        if (container.children.length === 0) {
            container.innerHTML = '<p id="emptyNotice" class="empty-text">太棒了！目前沒有待繳作業！</p>';
        }
    }
</script>

</body>
</html>

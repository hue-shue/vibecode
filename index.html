<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作業催繳器</title>
    <style>
        :root {
            --primary-color: #ff6b6b;
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #fa5252;
        }
        .nag-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #fff3bf;
            border-left: 5px solid #f59f00;
            border-radius: 4px;
            font-size: 0.95rem;
            color: #e67700;
            display: none;
        }
        .task-list {
            margin-top: 25px;
        }
        .task-card {
            background: #fff;
            border: 1px solid #eee;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .task-info h3 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
        }
        .task-info p {
            margin: 0;
            color: #777;
            font-size: 0.85rem;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-left: 5px;
            color: white;
            background-color: #e03131;
        }
        .task-actions {
            display: flex;
            gap: 8px;
        }
        .btn-nag {
            background-color: #fab005;
            width: auto;
            padding: 6px 12px;
            font-size: 0.85rem;
        }
        .btn-done {
            background-color: #40c057;
            width: auto;
            padding: 6px 12px;
            font-size: 0.85rem;
        }
        .empty-text {
            color: #999;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚨 作業催繳器</h1>
    <div class="subtitle">專為拖延症設計的智慧督促系統（具備本地儲存）</div>

    <div class="form-group">
        <label for="taskName">作業名稱</label>
        <input type="text" id="taskName" placeholder="例如：資料結構小考複習">
    </div>
    <div class="form-group">
        <label for="taskDate">截止日期</label>
        <input type="date" id="taskDate">
    </div>
    <button type="button" onclick="addTask()">新增作業並開始倒數</button>

    <div id="nagBox" class="nag-box"></div>

    <div class="task-list">
        <h3>📋 目前待繳作業清單</h3>
        <div id="taskListContainer"></div>
    </div>
</div>

<script>
    const nagMessages = [
        "「明天再說」的明天已經到了，你還在滑手機？",
        "程式碼不會自己跑出來，快去寫作業！",
        "助教正在瞪著你，趕快把作業交出來！",
        "拖延是心靈的舒適圈，但會讓你的成績很痛苦。",
        "別看了，現在立刻打開編輯器！"
    ];

    // 頁面載入時自動讀取本地儲存
    document.addEventListener('DOMContentLoaded', renderTasks);

    function getStoredTasks() {
        return JSON.parse(localStorage.getItem('tasks') || '[]');
    }

    function saveTasks(tasks) {
        localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    function addTask() {
        const nameInput = document.getElementById('taskName');
        const dateInput = document.getElementById('taskDate');
        const name = nameInput.value.trim();
        const date = dateInput.value;
        
        if (!name || !date) {
            alert('請完整填寫作業名稱與截止日期！');
            return;
        }

        const tasks = getStoredTasks();
        tasks.push({ name, date });
        saveTasks(tasks);

        nameInput.value = '';
        dateInput.value = '';
        renderTasks();
    }

    function removeTask(index) {
        const tasks = getStoredTasks();
        tasks.splice(index, 1);
        saveTasks(tasks);
        renderTasks();
    }

    function renderTasks() {
        const container = document.getElementById('taskListContainer');
        const tasks = getStoredTasks();

        if (tasks.length === 0) {
            container.innerHTML = '<p class="empty-text">太棒了！目前沒有待繳作業！</p>';
            return;
        }

        container.innerHTML = '';
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        tasks.forEach((task, index) => {
            const targetDate = new Date(task.date);
            const diffTime = targetDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            let daysText = "";
            if (diffDays < 0) {
                daysText = `<span class="badge" style="background-color: #868e96;">已逾期</span>`;
            } else if (diffDays === 0) {
                daysText = `<span class="badge">今天截止！</span>`;
            } else {
                daysText = `<span class="badge" style="background-color: #15aabf;">還剩 ${diffDays} 天</span>`;
            }

            const card = document.createElement('div');
            card.className = 'task-card';
            card.innerHTML = `
                <div class="task-info">
                    <h3>${task.name} ${daysText}</h3>
                    <p>截止日期：${task.date}</p>
                </div>
                <div class="task-actions">
                    <button type="button" class="btn-nag" onclick="showNag()">催繳碎碎念</button>
                    <button type="button" class="btn-done" onclick="removeTask(${index})">完成繳交</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function showNag() {
        const nagBox = document.getElementById('nagBox');
        const randomMsg = nagMessages[Math.floor(Math.random() * nagMessages.length)];
        nagBox.style.display = 'block';
        nagBox.innerText = `💡 催繳提示：${randomMsg}`;
    }
</script>

</body>
</html>
